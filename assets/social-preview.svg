<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- Header band: full width available above y=180 -->
  <text x="80" y="108" font-size="76" font-weight="700" fill="#e6edf3">
    <tspan fill="#3fb950">$</tspan> frontend-starter-cli
  </text>
  <text x="80" y="152" font-size="26" fill="#8b949e">Modern frontend projects in seconds — one command, your stack.</text>

  <!-- Left column: framework chips (max right edge 660, card starts at 700) -->
  <g font-size="20" font-weight="600" text-anchor="middle">
    <g>
      <rect x="80"  y="216" width="128" height="44" rx="22" fill="#0d2a33" stroke="#16414d"/><text x="144" y="245" fill="#61dafb">React</text>
      <rect x="222" y="216" width="128" height="44" rx="22" fill="#161b22" stroke="#30363d"/><text x="286" y="245" fill="#e6edf3">Next.js</text>
      <rect x="364" y="216" width="128" height="44" rx="22" fill="#12261f" stroke="#1f4a3a"/><text x="428" y="245" fill="#42b883">Vue</text>
      <rect x="506" y="216" width="128" height="44" rx="22" fill="#2d1214" stroke="#57272a"/><text x="570" y="245" fill="#ff7b72">Svelte</text>
    </g>
    <g>
      <rect x="80"  y="274" width="128" height="44" rx="22" fill="#131f33" stroke="#24406b"/><text x="144" y="303" fill="#7ab6ff">Solid</text>
      <rect x="222" y="274" width="128" height="44" rx="22" fill="#201a2e" stroke="#3d2f5c"/><text x="286" y="303" fill="#ac7ef4">Qwik</text>
      <rect x="364" y="274" width="128" height="44" rx="22" fill="#2b150c" stroke="#5a2f1a"/><text x="428" y="303" fill="#ff9d52">Astro</text>
      <rect x="506" y="274" width="128" height="44" rx="22" fill="#2a1013" stroke="#571f24"/><text x="570" y="303" fill="#f8756b">Angular</text>
    </g>
    <g font-weight="500" fill="#8b949e">
      <rect x="80"  y="332" width="128" height="44" rx="22" fill="#111822" stroke="#2d3b4d"/><text x="144" y="361">TS · JS</text>
      <rect x="222" y="332" width="128" height="44" rx="22" fill="#111822" stroke="#2d3b4d"/><text x="286" y="361">Tailwind</text>
      <rect x="364" y="332" width="128" height="44" rx="22" fill="#111822" stroke="#2d3b4d"/><text x="428" y="361">ESLint</text>
      <rect x="506" y="332" width="128" height="44" rx="22" fill="#111822" stroke="#2d3b4d"/><text x="570" y="361">Presets</text>
    </g>
  </g>

  <text x="80" y="560" font-size="23" fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">npx frontend-starter-cli create my-app</text>

  <!-- Terminal card: x 700..1200, y 200..560 -->
  <g>
    <rect x="700" y="200" width="500" height="360" rx="16" fill="#161b22" stroke="#30363d"/>
    <path d="M 700 216 a 16 16 0 0 1 16 -16 h 468 a 16 16 0 0 1 16 16 v 28 h -500 z" fill="#1c2128"/>
    <circle cx="730" cy="222" r="7" fill="#f85149"/>
    <circle cx="754" cy="222" r="7" fill="#d29922"/>
    <circle cx="778" cy="222" r="7" fill="#3fb950"/>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="18">
      <text x="728" y="284" fill="#8b949e"><tspan fill="#3fb950">$</tspan> frontend-starter create my-app</text>
      <text x="728" y="330" fill="#8b949e">◆  Starting point</text>
      <text x="728" y="362"><tspan fill="#58a6ff">❯ Blog</tspan><tspan fill="#8b949e">   Dashboard   Landing   Custom</tspan></text>
      <text x="728" y="408" fill="#8b949e">framework  <tspan fill="#e6edf3">React 19 · Vite 8</tspan></text>
      <text x="728" y="440" fill="#8b949e">language   <tspan fill="#e6edf3">TypeScript</tspan></text>
      <text x="728" y="472" fill="#8b949e">styling    <tspan fill="#e6edf3">Tailwind v4</tspan></text>
      <text x="728" y="516" fill="#3fb950">✔ Project ready in 3.2s</text>
